name: CI

on:
  push:
    branches: [main, cicd-workflows]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 初始化測試資料庫
        run: python init_db.py

      - name: 執行單元測試
        run: python -m pytest tests/ -v

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: 安裝套件（供 CodeQL 分析使用）
        run: pip install -r requirements.txt

      - name: 執行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
